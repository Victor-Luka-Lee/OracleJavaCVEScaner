[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "java-vulnerability-inspector"
version = "0.1.0"
description = "Read-only Java inventory and official-advisory impact assessment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JVI contributors" }]
dependencies = [
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
jvi = "jvi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jvi"]

[tool.hatch.build.targets.wheel.force-include]
"data/advisories" = "jvi/data/advisories"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

